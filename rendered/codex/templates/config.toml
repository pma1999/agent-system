# System keys for the multi-agent setup. Merged ADDITIVELY into ~/.codex/config.toml
# by ~/.claude/install.ps1: missing top-level keys are prepended, missing [tables]
# appended, existing values are NEVER overwritten. Machine-specific state (project
# trust, notify, plugins, runtimes) never lives here.

model = "gpt-5.6-luna"
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "max"
approval_policy = "never"

[features]
multi_agent = true

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.codegraph.tools.codegraph_status]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_context]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_files]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_search]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_impact]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_node]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_callers]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_callees]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_explore]
approval_mode = "approve"

# Sandbox: los especialistas necesitan red para verificar contratos externos,
# instalar lo que el repo pida y hablar con un dev server local. Aditivo: si ya
# tienes la tabla, tu valor manda.
[sandbox_workspace_write]
network_access = true

# Navegador. Los dos MCP conviven a proposito: cada agente elige el que mejor
# encaje con lo que tiene delante.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--headless", "--browser", "chromium", "--allow-unrestricted-file-access"]

# Sin guion a proposito: un id citado (`"chrome-devtools"`) es TOML valido pero
# depende de que Codex lo acepte como nombre de servidor, y un servidor que no
# carga no da error, se ignora en silencio.
[mcp_servers.chrome_devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--headless", "--isolated", "--allow-unrestricted-paths"]
