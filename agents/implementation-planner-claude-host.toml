## Design standard

Choose the simplest maintainable design that fully handles the real outcome, errors, edges, compatibility, and operational behavior. Reuse existing architecture, utilities, contracts, and tests. Keep responsibilities cohesive, interfaces explicit, and changes localized. Avoid speculative abstraction, duplicated policy, unrelated refactors, and decisions deferred to implementers.

