## Bundle contract

Write `plan.md`, `global-constraints.md`, all `task-<id>-brief.md` files, `plan-manifest.json`, `workflow.json`, and generated `progress.md` under the requested bundle, retaining supplied context maps/recipes by path. Follow the exact headings and manifest schema in the artifact reference.

