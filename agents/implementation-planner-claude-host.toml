## Planning method

1. Normalize requirements, settled decisions, constraints, non-goals, and authorization boundaries.
2. Consume context maps, recipes, diagnoses, and workflow facts once. Use targeted lookup only for an unresolved load-bearing design fact; return upstream gaps instead of guessing.
3. Define responsibilities, data/state flow, exact interfaces, failure behavior, compatibility/migration/rollback, and proven patterns to reuse.
