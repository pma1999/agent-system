# Adaptador Codex CLI.
#
# No hay agente orquestador: coordina el hilo Codex de nivel superior. Los
# especialistas son ficheros TOML que Codex descubre por convención bajo
# $CODEX_HOME/agents/. La colaboración es nativa y requiere
# `[features] multi_agent = true` en config.toml.

harness = "codex"
install_dir = "~/.codex"
agent_format = "toml_developer_instructions"
agent_path = "agents/{role}.toml"
skill_path = "skills/{skill}/SKILL.md"

obsolete = [
  "skills/orchestrator.zip",
  "skills/orchestrator/references",
  "agents/implementation-planner-claude-host.toml",
]

[tokens]
ORCH_SKILL = "orchestrator"
WORKFLOW = "orchestrator"
PARENT = "thread"
COORDINATOR = "the top-level Codex thread"
SPAWN = "`spawn_agent` with `agent_type` set to the roster name and `fork_turns=\"none\"`"
RESUME = "`followup_task` on the recorded owner"
OWNER_ID = "agent id"
ASK_USER = "a direct question in the thread"
PROVENANCE = "engine=codex | model=gpt-6-sol | effort=xhigh"
MODEL_PIN = "a fixed per-role profile declared in each agent TOML"
BUNDLE_LINT = "python ~/.codex/skills/orchestrator/scripts/bundle_lint.py"

COORDINATOR_INTRO = """
You are the parent coordinator: the current top-level Codex thread. You talk to the user, retain
responsibility for the complete outcome, choose the lightest safe lane, dispatch specialists,
maintain durable artifacts, enforce approval and quality gates, and report the observed result.
Never create or spawn a separate orchestrator agent."""
ROSTER_ADVISOR = "| `advisor` | Read-only second opinion on decisions, risks, and stuck states | nothing |"

ADVISOR_DELEGATION = """
You may spawn only fresh `advisor` consultations, and only at a genuine decision point: you are
stuck after two failed attempts, or a high-stakes choice your inputs do not settle. Use
`spawn_agent` with `agent_type="advisor"`, `fork_turns="all"`, a complete Consultation Brief, then
`wait_agent`. Each consult is a new advisor; never resume one as a work owner. If depth or capacity
prevents it, return the decision point to the parent instead. All other delegation is forbidden.\
"""

ADVISOR_CONTEXT = """
- A spawned consultation receives a Consultation Brief (`Context`, `Evidence`, `Question`,
  `Constraints`) plus the caller's retained thread through native `fork_turns="all"`. The inherited
  thread is chronological and authoritative, subject to normal Codex compaction. Do not ask the
  caller to re-narrate history already visible.
- As a directly selected primary session, the conversation itself is your context. Answer with the
  same decision discipline, conversationally.\
"""

# --- Envoltorios por rol -------------------------------------------------
# `frontmatter` son las claves TOML que preceden a `developer_instructions`.
# Se conserva el escalado de modelos que ya tenía Codex.

[agents.codebase-explorer]
model = "gpt-6-luna"
effort = "max"
frontmatter = """
name = "codebase-explorer"
description = '''{{DESCRIPTION}}'''
model = "gpt-6-luna"
model_reasoning_effort = "{{EFFORT}}"
sandbox_mode = "workspace-write"
nickname_candidates = ["Mapper", "Surveyor", "Cartographer"]\
"""

