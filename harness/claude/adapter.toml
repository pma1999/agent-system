# --- Skill orquestadora ---------------------------------------------------

[skill]
frontmatter = """
name: orchestrator
description: >-
  Optional multi-agent engineering workflow. Apply it only when the user asks to orchestrate, invokes
  it by name, or clearly asks for the multi-agent workflow: the main Claude Code thread then
  coordinates discovery, external-contract research, planning, BDD implementation, independent
  review, debugging, and remediation through dedicated specialist subagents. Do not apply it
  automatically to ordinary engineering work, and never load it from a specialist subagent.\
"""
